<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Полезные утилиты</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🏠</text></svg>">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #4CAF50;
            --accent-color: #2E8B57;
            --background-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            --hover-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--background-gradient);
            min-height: 100vh;
            color: var(--primary-color);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .description {
            color: #5a6b7c;
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.5;
        }
        
        /* Кнопка настроек */
        .settings-wrapper {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .settings-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 24px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .settings-btn:hover {
            transform: rotate(30deg);
            background: var(--secondary-color);
        }
        
        /* Модальное окно настроек */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--hover-shadow);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-content h3 {
            margin-bottom: 20px;
            color: var(--primary-color);
        }
        
        .modal-option {
            margin-bottom: 15px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .modal-option:hover {
            border-color: var(--secondary-color);
            background: #f9f9f9;
        }
        
        .modal-option.selected {
            border-color: var(--secondary-color);
            background: #e8f5e9;
        }
        
        .modal-option input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
        }
        
        .modal-option label {
            cursor: pointer;
            flex-grow: 1;
            font-weight: 500;
        }
        
        .option-desc {
            font-size: 12px;
            color: #5a6b7c;
            margin-top: 4px;
        }
        
        .close-modal {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .close-modal:hover {
            background: var(--accent-color);
        }
        
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .filter-button {
            padding: 8px 16px;
            background: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .filter-button.active, .filter-button:hover {
            background: var(--secondary-color);
            color: white;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .utility-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease forwards;
        }
        
        .utility-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
        }
        
        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .card-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }
        
        .card-description {
            color: #5a6b7c;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
            flex-grow: 1;
        }
        
        .card-button {
            background: linear-gradient(to right, var(--secondary-color), var(--accent-color));
            border: none;
            color: white;
            padding: 12px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: auto;
        }
        
        .card-button:hover {
            background: linear-gradient(to right, #45a049, var(--accent-color));
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            color: #5a6b7c;
            font-size: 14px;
        }
        
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: #5a6b7c;
            display: none;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            h1 {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .grid-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Полезные утилиты</h1>
            <p class="description">Коллекция полезных инструментов для повседневной работы.</p>
            
            <div class="filter-buttons">
                <button class="filter-button active" data-filter="all">Все</button>
                <button class="filter-button" data-filter="generator">Генераторы</button>
                <button class="filter-button" data-filter="management">Управление</button>
                <button class="filter-button" data-filter="tools">Инструменты</button>
            </div>
        </header>
        
        <div class="grid-container" id="utilitiesGrid">
            <!-- Карточки будут добавлены через JavaScript -->
            <div class="no-results" id="noResults">
                <h3>Ничего не найдено</h3>
                <p>Попробуйте выбрать другую категорию</p>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Полезные утилиты | LarTech</p>
        </footer>
    </div>

    <!-- Кнопка настроек -->
    <div class="settings-wrapper">
        <button class="settings-btn" id="settingsBtn">⚙️</button>
    </div>

    <!-- Модальное окно настроек -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>⚙️ Настройки открытия вкладок</h3>
            
            <div class="modal-option" data-mode="new">
                <input type="radio" name="tabMode" id="modeNew" value="new">
                <label for="modeNew">
                    🆕 Новая вкладка
                    <div class="option-desc">При каждом нажатии открывается новая вкладка</div>
                </label>
            </div>
            
            <div class="modal-option" data-mode="focus">
                <input type="radio" name="tabMode" id="modeFocus" value="focus">
                <label for="modeFocus">
                    🎯 Фокус на существующую
                    <div class="option-desc">Повторное нажатие переключает на уже открытую вкладку</div>
                </label>
            </div>
            
            <button class="close-modal" id="closeModalBtn">Готово</button>
        </div>
    </div>

    <script>
        // Массив с данными о утилитах
        const utilities = [
            { 
                name: "Генераторы", 
                url: "packages/hex-commands-generator/index.html",
                description: "Генератор HEX команд для различных устройств и систем",
                category: "generator",
                tags: ["команды", "hex", "генерация"]
            },
            { 
                name: "Овнеры", 
                url: "packages/owner/index.html",
                description: "Управление владельцами устройств и настройками прав доступа",
                category: "management",
                tags: ["владельцы", "управление", "доступ"]
            },
            { 
                name: "Метки", 
                url: "packages/mark/index.html",
                description: "Создание и управление метками для устройств и объектов",
                category: "management",
                tags: ["метки", "теги", "организация"]
            },
            { 
                name: "Светильники", 
                url: "packages/lightSerialNumber/index.html",
                description: "Работа с серийными номерами светильников и осветительных приборов",
                category: "tools",
                tags: ["светильники", "серийные номера", "освещение"]
            },
            { 
                name: "Добавление не наших ПУ в US", 
                url: "packages/sql_command/index.html",
                description: "Генерация SQL команд для добавления посторонних приборов учета",
                category: "tools",
                tags: ["sql", "базы данных", "приборы учета"]
            },
            { 
                name: "Формирование команд для отправки файлом на тепло и газ", 
                url: "packages/komand_warm/index.html",
                description: "Создание командных файлов для систем отопления и газоснабжения",
                category: "generator",
                tags: ["тепло", "газ", "команды", "файлы"]
            },
            { 
                name: "Показания", 
                url: "packages/indications/index.html",
                description: "Анализ показаний ПУ",
                category: "tools",
                tags: ["файлы"]
            },
            { 
                name: "Ключи", 
                url: "packages/key/index.html",
                description: "Массовая замена ключей",
                category: "management",
                tags: ["файлы"]
            },
            { 
                name: "Время", 
                url: "packages/time/index.html",
                description: "Парсер времени на downlink показаний",
                category: "tools",
                tags: ["файлы"]
            },
            { 
                name: "TemplateDownlink", 
                url: "packages/templateCommand",
                description: "Генератор CSV файлов для Downlink",
                category: "tools",
                tags: ["файлы"]
            },
            { 
                name: "Байты", 
                url: "packages/bytes/index.html",
                description: "Работа с байтами uplink/downlink",
                category: "tools",
                tags: ["инструменты"]
            },
            { 
                name: "Генератор планировщика суточных", 
                url: "http://10.78.0.163:5000/",
                description: "Генератор и декодер команд планировщика",
                category: "tools",
                tags: ["инструменты"]
            }
        ];

        // Получаем элементы
        const utilitiesGrid = document.getElementById('utilitiesGrid');
        const filterButtons = document.querySelectorAll('.filter-button');
        const noResultsDiv = document.getElementById('noResults');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalOptions = document.querySelectorAll('.modal-option');
        
        // Хранилище открытых окон
        const openWindows = new Map();
        
        // Состояния
        let activeFilter = 'all';
        let tabMode = localStorage.getItem('tabMode') || 'new';
        
        // Функция открытия утилиты
        function openUtility(url, name) {
            if (tabMode === 'new') {
                // Режим "Новая вкладка"
                window.open(url, '_blank');
            } else {
                // Режим "Фокус"
                if (openWindows.has(url)) {
                    const existingWindow = openWindows.get(url);
                    if (existingWindow && !existingWindow.closed) {
                        existingWindow.focus();
                    } else {
                        const newWindow = window.open(url, name.replace(/\s/g, '_'));
                        openWindows.set(url, newWindow);
                    }
                } else {
                    const newWindow = window.open(url, name.replace(/\s/g, '_'));
                    openWindows.set(url, newWindow);
                }
            }
        }
        
        // Рендер карточек
        function renderUtilities() {
            utilitiesGrid.innerHTML = '';
            
            const filtered = utilities.filter(utility => {
                return activeFilter === 'all' || utility.category === activeFilter;
            });
            
            if (filtered.length === 0) {
                noResultsDiv.style.display = 'block';
                return;
            }
            
            noResultsDiv.style.display = 'none';
            
            filtered.forEach((utility, index) => {
                const card = document.createElement('div');
                card.className = 'utility-card';
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <div class="card-content">
                        <h3 class="card-title">${escapeHtml(utility.name)}</h3>
                        <p class="card-description">${escapeHtml(utility.description)}</p>
                        <button class="card-button" data-url="${escapeHtml(utility.url)}" data-name="${escapeHtml(utility.name)}">Открыть</button>
                    </div>
                `;
                
                utilitiesGrid.appendChild(card);
            });
            
            // Добавляем обработчики на кнопки
            document.querySelectorAll('.card-button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const url = btn.getAttribute('data-url');
                    const name = btn.getAttribute('data-name');
                    openUtility(url, name);
                });
            });
        }
        
        // Защита от XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Открыть настройки
        function openSettingsModal() {
            // Устанавливаем выбранный режим
            const radioNew = document.getElementById('modeNew');
            const radioFocus = document.getElementById('modeFocus');
            
            if (tabMode === 'new') {
                radioNew.checked = true;
                document.querySelector('.modal-option[data-mode="new"]').classList.add('selected');
                document.querySelector('.modal-option[data-mode="focus"]').classList.remove('selected');
            } else {
                radioFocus.checked = true;
                document.querySelector('.modal-option[data-mode="focus"]').classList.add('selected');
                document.querySelector('.modal-option[data-mode="new"]').classList.remove('selected');
            }
            
            settingsModal.classList.add('show');
        }
        
        // Закрыть настройки
        function closeSettingsModal() {
            settingsModal.classList.remove('show');
        }
        
        // Сохранить настройки
        function saveSettings() {
            const selectedRadio = document.querySelector('input[name="tabMode"]:checked');
            if (selectedRadio) {
                tabMode = selectedRadio.value;
                localStorage.setItem('tabMode', tabMode);
            }
            closeSettingsModal();
        }
        
        // Обработчики событий
        settingsBtn.addEventListener('click', openSettingsModal);
        closeModalBtn.addEventListener('click', saveSettings);
        
        // Закрытие по клику на фон
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                closeSettingsModal();
            }
        });
        
        // Обработка выбора опций
        modalOptions.forEach(option => {
            const radio = option.querySelector('input');
            
            // Клик по всей области опции
            option.addEventListener('click', (e) => {
                // Если кликнули не по радио-кнопке, то программно переключаем
                if (e.target !== radio) {
                    radio.checked = true;
                    // Триггерим событие change
                    const changeEvent = new Event('change');
                    radio.dispatchEvent(changeEvent);
                }
            });
            
            // При изменении радио-кнопки
            radio.addEventListener('change', () => {
                if (radio.checked) {
                    modalOptions.forEach(opt => opt.classList.remove('selected'));
                    option.classList.add('selected');
                }
            });
        });
        
        // Фильтрация
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                activeFilter = button.getAttribute('data-filter');
                renderUtilities();
            });
        });
        
        // Очистка закрытых окон (каждые 5 секунд)
        setInterval(() => {
            for (const [url, win] of openWindows.entries()) {
                if (win.closed) {
                    openWindows.delete(url);
                }
            }
        }, 5000);
        
        // Запуск
        renderUtilities();
    </script>
</body>
</html>
