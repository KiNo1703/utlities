<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Полезные утилиты</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🏠</text></svg>">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #4CAF50;
            --accent-color: #2E8B57;
            --background-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            --hover-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--background-gradient);
            min-height: 100vh;
            color: var(--primary-color);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .description {
            color: #5a6b7c;
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.5;
        }
        
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .filter-button {
            padding: 8px 16px;
            background: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .filter-button.active, .filter-button:hover {
            background: var(--secondary-color);
            color: white;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .utility-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease forwards;
        }
        
        .utility-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
        }
        
        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .card-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }
        
        .card-description {
            color: #5a6b7c;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
            flex-grow: 1;
        }
        
        .card-button {
            background: linear-gradient(to right, var(--secondary-color), var(--accent-color));
            border: none;
            color: white;
            padding: 12px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: auto;
        }
        
        .card-button:hover {
            background: linear-gradient(to right, #45a049, var(--accent-color));
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            color: #5a6b7c;
            font-size: 14px;
        }
        
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: #5a6b7c;
            display: none;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            h1 {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .grid-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Полезные утилиты</h1>
            <p class="description">Коллекция полезных инструментов для повседневной работы.</p>
            
            <div class="filter-buttons">
                <button class="filter-button active" data-filter="all">Все</button>
                <button class="filter-button" data-filter="generator">Генераторы</button>
                <button class="filter-button" data-filter="management">Управление</button>
                <button class="filter-button" data-filter="tools">Инструменты</button>
            </div>
        </header>
        
        <div class="grid-container" id="utilitiesGrid">
            <!-- Карточки будут добавлены через JavaScript -->
            <div class="no-results" id="noResults">
                <h3>Ничего не найдено</h3>
                <p>Попробуйте выбрать другую категорию</p>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Полезные утилиты | LarTech</p>
        </footer>
    </div>

    <script>
        // Массив с данными о утилитах
        const utilities = [
            { 
                name: "Генераторы", 
                url: "packages/hex-commands-generator/index.html",
                description: "Генератор HEX команд для различных устройств и систем",
                category: "generator",
                tags: ["команды", "hex", "генерация"]
            },
            { 
                name: "Овнеры", 
                url: "packages/owner/index.html",
                description: "Управление владельцами устройств и настройками прав доступа",
                category: "management",
                tags: ["владельцы", "управление", "доступ"]
            },
            { 
                name: "Метки", 
                url: "packages/mark/index.html",
                description: "Создание и управление метками для устройств и объектов",
                category: "management",
                tags: ["метки", "теги", "организация"]
            },
            { 
                name: "Светильники", 
                url: "packages/lightSerialNumber/index.html",
                description: "Работа с серийными номерами светильников и осветительных приборов",
                category: "tools",
                tags: ["светильники", "серийные номера", "освещение"]
            },
            { 
                name: "Добавление не наших ПУ в US", 
                url: "packages/sql_command/index.html",
                description: "Генерация SQL команд для добавления посторонних приборов учета",
                category: "tools",
                tags: ["sql", "базы данных", "приборы учета"]
            },
            { 
                name: "Формирование команд для отправки файлом на тепло и газ", 
                url: "packages/komand_warm/index.html",
                description: "Создание командных файлов для систем отопления и газоснабжения",
                category: "generator",
                tags: ["тепло", "газ", "команды", "файлы"]
            },
			{ 
                name: "Показания", 
                url: "packages/indications/index.html",
                description: "Анализ показаний ПУ",
                category: "tools",
                tags: ["файлы"]
            },
			{ 
                name: "Ключи", 
                url: "packages/key/index.html",
                description: "Массовая замена ключей",
                category: "management",
                tags: ["файлы"]
            },
			{ 
                name: "Время", 
                url: "packages/time/index.html",
                description: "Парсер времени на downlink показаний",
                category: "tools",
                tags: ["файлы"]
            },
				{ 
                name: "TemplateDownlink", 
                url: "packages/templateCommand",
                description: "Генератор CSV файлов для Downlink",
                category: "tools",
                tags: ["файлы"]
            },
			{ 
                name: "Байты", 
                url: "packages/bytes/index.html",
                description: "Работа с байтами uplink/downlink",
                category: "tools",
                tags: ["инструменты"]
            },
		{ 
                name: "Генератор планирощика суточных", 
                url: "http://10.78.0.163:5000/",
                description: "Генератор и декодер команд планирощика",
                category: "tools",
                tags: ["инструменты"]
            }
        ];

        // Элементы DOM
        const utilitiesGrid = document.getElementById('utilitiesGrid');
        const filterButtons = document.querySelectorAll('.filter-button');
        const noResults = document.getElementById('noResults');
        
        // Текущий активный фильтр
        let activeFilter = 'all';

        // Функция для создания карточек утилит
        function renderUtilities() {
            utilitiesGrid.innerHTML = '';
            let hasResults = false;
            
            // Фильтрация утилит
            const filteredUtilities = utilities.filter(utility => {
                return activeFilter === 'all' || utility.category === activeFilter;
            });
            
            // Создание карточек
            filteredUtilities.forEach((utility, index) => {
                hasResults = true;
                
                const card = document.createElement('div');
                card.className = 'utility-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="card-content">
                        <h3 class="card-title">${utility.name}</h3>
                        <p class="card-description">${utility.description}</p>
                        <button class="card-button" onclick="window.open('${utility.url}', '_blank')">Открыть</button>
                    </div>
                `;
                
                utilitiesGrid.appendChild(card);
            });
            
            // Показать/скрыть сообщение о отсутствии результатов
            noResults.style.display = hasResults ? 'none' : 'block';
        }

        // Фильтрация
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Убрать активный класс у всех кнопок
                filterButtons.forEach(btn => btn.classList.remove('active'));
                
                // Добавить активный класс к текущей кнопке
                button.classList.add('active');
                
                // Установить активный фильтр
                activeFilter = button.dataset.filter;
                
                // Перерисовать утилиты
                renderUtilities();
            });
        });

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            renderUtilities();
        });
    </script>
</body>
</html>
